<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gavin's Canvas</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .hero-section {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 4rem 2rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card {
            border: none;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Hero Section -->
        <div class="hero-section text-center">
            <h1 class="display-4 fw-bold">Canvas Mini-Lab</h1>
            <p class="lead" th:text="${message}">Welcome to Gavin's Canvas</p>
            <div class="badge bg-light text-dark px-3 py-2 fs-6 mt-2" th:text="'Powered by ' + ${framework}">Framework details</div>
            </div>

            <!-- Term Filter -->
            <div class="row justify-content-center mb-5">
                <div class="col-md-4">
                    <form th:action="@{/}" method="get" class="input-group shadow-sm">
                        <label class="input-group-text" for="termSelect">Filter by Term</label>
                        <select class="form-select" id="termSelect" name="term" onchange="this.form.submit()">
                            <option value="">All Terms</option>
                            <option th:each="term : ${terms}" 
                                    th:value="${term}" 
                                    th:text="${term}"
                                    th:selected="${term == selectedTerm}"></option>
                        </select>
                    </form>
                </div>
            </div>

            <div class="row g-4 justify-content-center">

            <th:block th:each="course : ${courses}">
                <div class="col-md-6">
                    <div class="card h-100 p-4">
                        <h3 class="h5 border-bottom pb-2 mb-3 text-primary">
                            <strong th:text="${course.name}">Course Name</strong> 
                            <small class="text-muted" th:text="${course.code}"></small>
                        </h3>
                            <ul class="list-group list-group-flush">
                                <th:block th:each="assignment : ${assignments}" th:if="${assignment.courseId} == ${course.id}">
                                    <a th:href="@{/assignments/{id}(id=${course.id})}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center bg-transparent px-0">
                                        <div class="ms-2 me-auto">
                                            <div class="fw-bold" th:text="${assignment.name}">Assignment Name</div>
                                            <small class="text-muted" th:if="${assignment.dueDate}" 
                                                th:text="'Due: ' + ${#temporals.format(assignment.dueDate, 'MMM dd, h:mm a')}"></small>
                                        </div>
                                        <span class="badge bg-secondary rounded-pill" th:text="${assignment.pointsPossible} + ' pts'"></span>
                                    </a>
                                </th:block>
                        </ul>
                    </div>
                </div>
            </th:block>
        </div>

    
    </div>

    <!-- Bootstrap 5 Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
