<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${assignment.name}">Assignments</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .hero-section {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 4rem 2rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card {
            border: none;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Hero Section -->
        <div class="hero-section text-center">
            <h1 class="display-4 fw-bold">Canvas Mini-Lab</h1>
            <p class="lead" th:text="${message}">Welcome to Gavin's Canvas</p>
            <p class="lead" th:text="${course.name}"></p>
        </div>

        <div class="g-4 justify-content-center">
            <div class="card h-100 p-4">
                <div class="my-2">
                    <div class="fw-bold" th:text="${assignment.name}">Assignment Name</div>
                    <small class="text-muted" th:if="${assignment.dueDate}" 
                        th:text="'Due: ' + ${#temporals.format(assignment.dueDate, 'MMM dd, h:mm a')}"></small>
                </div>
                <p th:utext="${assignment.description}" class="mb-0"></p>
            </div>
        </div>
    
    </div>

    <!-- Bootstrap 5 Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
